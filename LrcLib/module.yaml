product:
  type: lib
  platforms: [android]

apply:
  - //android-common.module-template.yaml

settings:
  android:
    namespace: com.kynarec.lrclib
    minSdk: 30
    compileSdk:
      apiLevel: 37
  kotlin:
    serialization:
      format: json
  jvm:
    jdk:
      version: 21

dependencies:
  - $libs.androidx.core.ktx
  - $libs.androidx.appcompat
  - $libs.ktor.client.core
  - $libs.ktor.client.okhttp
  - $libs.ktor.client.content.negotiation
  - $libs.ktor.serialization.json
  - $libs.kotlinx.serialization.json

test-dependencies:
  - $libs.junit
