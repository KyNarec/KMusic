name: Android CI Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.1.8)'
        required: true
        default: 'v0.1.8'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create a release

    env:
      CI: "true"
      KOTLIN_CLI_NO_WELCOME_BANNER: "1"
      KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 --decode > release.keystore
          cat > app/keystore.properties <<EOF
          storeFile=${{ github.workspace }}/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build and package with Kotlin Toolchain
        run: |
          # Release builds ship without the .debug suffix (the Toolchain has no
          # per-variant applicationId, so local dev builds use the .debug ID).
          sed -i 's/applicationId: com.kynarec.kmusic.debug/applicationId: com.kynarec.kmusic/' app/module.yaml
          ./kotlin build -m app -v release
          ./kotlin test
          ./kotlin package -m app

      - name: Stage signed release APK
        run: |
          cp build/tasks/_app_buildAndroidRelease/gradle-project-release.apk \
            KMusic_${{ github.event.inputs.version }}.apk
          ls -lh KMusic_*.apk build/tasks/_app_bundleAndroid/

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: KMusic-${{ github.run_number }}
          path: |
            KMusic_*.apk
            build/tasks/_app_bundleAndroid/gradle-project-release.aab

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
            tag_name: ${{ github.event.inputs.version }}
            name: ${{ github.event.inputs.version }}
            draft: true
            prerelease: false
            files: |
              KMusic_*.apk
              build/tasks/_app_bundleAndroid/gradle-project-release.aab
            token: ${{ github.token }}
